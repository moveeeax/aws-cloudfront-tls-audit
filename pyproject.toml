[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-cloudfront-tls-audit"
version = "0.1.0"
description = "Audit every CloudFront distribution's viewer and origin TLS posture in one pass"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["aws", "cloudfront", "tls", "security", "audit", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = ["boto3>=1.28"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
aws-cloudfront-tls-audit = "aws_cloudfront_tls_audit.cli:main"

[project.urls]
Homepage = "https://github.com/moveeeax/aws-cloudfront-tls-audit"
Issues = "https://github.com/moveeeax/aws-cloudfront-tls-audit/issues"

[tool.setuptools]
packages = ["aws_cloudfront_tls_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
