name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: Fixtures are reproducible
        run: |
          python examples/_build_fixtures.py
          git diff --exit-code -- examples/

      - name: CLI smoke test
        run: |
          aws-cloudfront-tls-audit --from-file examples/hardened-account.json
          set +e
          aws-cloudfront-tls-audit --from-file examples/messy-account.json --format json
          code=$?
          set -e
          test "$code" -eq 1
